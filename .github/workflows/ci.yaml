# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build *.sln --no-restore
    - name: Test with coverage
      run: dotnet test *.sln --no-build --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage-results
    - name: Install ReportGenerator
      run: dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./.tools
    - name: Generate coverage summary
      run: |
        ./.tools/reportgenerator "-reports:coverage-results/**/coverage.cobertura.xml" "-targetdir:coverage-report" "-reporttypes:Html;Cobertura;lcov;MarkdownSummaryGithub"
        cat coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report
    - name: Publish coverage report to coveralls.io
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        path-to-lcov: ./coverage-report/lcov.info
